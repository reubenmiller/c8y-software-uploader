# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Builds the release archives which "c8y extensions install <owner>/c8y-software-uploader" installs.
# Each archive contains the binary (bin/c8y-software-uploader) and the extension files.
version: 2

project_name: c8y-software-uploader

builds:
  - binary: bin/c8y-software-uploader
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - extension.yaml
      - README.md
      - LICENSE
      - views/**
      # Add other extension folders when you use them
      # - api/**
      # - templates/**
      # - commands/**

checksum:
  name_template: checksums.txt

changelog:
  use: github
